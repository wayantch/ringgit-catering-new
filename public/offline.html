<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7a8f6b">
    <title>Tidak ada koneksi | Ringgit Catering</title>
    <style>
        :root {
            --primary: #7a8f6b;
            --text: #2e2e2e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(122, 143, 107, 0.1), transparent 30%),
                linear-gradient(180deg, #fbfaf6 0%, #ffffff 40%, #f8f7f2 100%);
        }

        .card {
            width: 100%;
            max-width: 26rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 28px;
            padding: 2.5rem 1.75rem;
            box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
        }

        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            border-radius: 20px;
            background: var(--primary);
            color: #fff;
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 1.75rem;
            font-size: 0.925rem;
            line-height: 1.6;
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 0.85rem 1.25rem;
            border: 0;
            border-radius: 9999px;
            background: var(--primary);
            color: #fff;
            font-size: 0.925rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #6b7b58; }
    </style>
</head>

<body>
    <main class="card">
        <div class="mark">RC</div>
        <h1>Tidak ada koneksi</h1>
        <p>
            Halaman ini belum bisa dimuat karena perangkat sedang offline.
            Periksa koneksi internetmu, lalu coba lagi.
        </p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>

</html>
